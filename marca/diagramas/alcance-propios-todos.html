<!--
  Diagrama «alcance-propios-todos» · lámina de 1280×720 (viewBox). 3 fases.
  Fases: 1 la misma lista de 8 cotizaciones en las dos columnas · 2 «Solo los
  propios»: en la columna de Ana se apagan las de otros autores (candado) y
  queda «3 de 8» · 3 «Equipo»: vuelven las de José (Zona Este) y queda «5 de 8».
  El apagado usa .ajeno + .fase-2; la fase 3 re-enciende .ajeno.equipo y
  esconde lo que era solo de la fase 2 (.solo-f2, .solo-f12). El motor pone
  fase-1…fase-N en el contenedor.
  Corrección 09-27 (AUTOR C, video 08d): los datos casan con el canon E0 de la
  serie (seeds/seguridad/README.md): cotizaciones COT 8…COT 1 tal como las
  ordena la lista real (más reciente arriba); COT 1–3 de Ana, COT 4–5 de José,
  COT 6–7 de Carlos, COT 8 de Rosa. Recuentos reales: Carlos «Todos» 8 · Ana
  «Propios» 3 · Ana «Equipo» (Ana + José, Zona Este) 5. Antes: 6 documentos
  ilustrativos «COT-1042…» y 2 fases.
  Autores: Ana (teal), José (azul), Carlos (ámbar), Rosa (violeta).
  Textos: edítalos en su <text>.
-->
<style>
  svg{font-family:Inter,'Inter var',system-ui,'Segoe UI',Roboto,sans-serif}
  .t-tit{font-size:30px;font-weight:800;fill:var(--tinta)}
  .t-sub{font-size:17px;font-weight:500;fill:var(--tinta-2)}
  .card{fill:var(--tarjeta);stroke:var(--borde);stroke-width:1.5}
  .h{font-size:22px;font-weight:800;fill:var(--tinta)}
  .hc{font-size:14px;font-weight:500;fill:var(--tinta-2)}
  .fila{fill:var(--suave)}
  .doc{font-size:15px;font-weight:700;fill:var(--tinta)}
  .aut{font-size:14px;font-weight:600;fill:var(--tinta-2)}
  .ini{font-size:13px;font-weight:800;fill:#fff}
  .ley{font-size:14px;font-weight:600;fill:var(--tinta-2)}
  .cuenta{font-size:14px;font-weight:800;fill:#fff}
  .ajeno,.solo-f2,.solo-f12{transition:opacity .6s ease}
  .fase-2 .ajeno{opacity:.22}
  .fase-3 .ajeno.equipo{opacity:1}
  .fase-3 .solo-f2,.fase-3 .solo-f12{opacity:0}
</style>
<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#072134" flood-opacity=".10"/>
    </filter>
    <g id="candado">
      <circle cx="10" cy="10" r="11" fill="#C62828"/>
      <rect x="5.5" y="9" width="9" height="7" rx="1.5" fill="#fff"/>
      <path d="M7.4 9V7.4a2.6 2.6 0 0 1 5.2 0V9" fill="none" stroke="#fff" stroke-width="1.8"/>
    </g>
    <g id="embudo"><path d="M3 4h14l-5.5 6.5V16l-3 1.5v-7z" fill="#fff"/></g>
    <!-- filas: 44 px de alto, cada 50 px -->
    <g id="f-ana"><rect class="fila" width="492" height="44" rx="10"/><circle cx="26" cy="22" r="14" fill="#04B19E"/><text class="ini" x="26" y="27" text-anchor="middle">A</text></g>
    <g id="f-jose"><rect class="fila" width="492" height="44" rx="10"/><circle cx="26" cy="22" r="14" fill="#1273B8"/><text class="ini" x="26" y="27" text-anchor="middle">J</text></g>
    <g id="f-carlos"><rect class="fila" width="492" height="44" rx="10"/><circle cx="26" cy="22" r="14" fill="#F5A623"/><text class="ini" x="26" y="27" text-anchor="middle">C</text></g>
    <g id="f-rosa"><rect class="fila" width="492" height="44" rx="10"/><circle cx="26" cy="22" r="14" fill="#5B6FD0"/><text class="ini" x="26" y="27" text-anchor="middle">R</text></g>
  </defs>

  <rect x="80" y="52" width="48" height="6" rx="3" fill="#5BD34E"/>
  <text class="t-tit" x="80" y="96">Alcance: ¿qué cotizaciones ve cada quien?</text>
  <text class="t-sub" x="80" y="126">El mismo permiso «Cotizaciones · Ver»: cuentan las cotizaciones según quién las creó.</text>
  <g transform="translate(900,150)">
    <circle cx="6" cy="0" r="6" fill="#04B19E"/><text class="ley" x="16" y="5">Ana</text>
    <circle cx="70" cy="0" r="6" fill="#1273B8"/><text class="ley" x="80" y="5">José</text>
    <circle cx="136" cy="0" r="6" fill="#F5A623"/><text class="ley" x="146" y="5">Carlos</text>
    <circle cx="214" cy="0" r="6" fill="#5B6FD0"/><text class="ley" x="224" y="5">Rosa</text>
  </g>

  <g data-fase="1">
    <!-- Columna «Todos» (Carlos) -->
    <g transform="translate(80,168)">
      <rect class="card" width="540" height="504" rx="12" filter="url(#sombra)"/>
      <text class="h" x="28" y="42">Todos</text>
      <text class="hc" x="28" y="66">Carlos ve las de cualquier persona</text>
      <g transform="translate(24,84)"><use href="#f-rosa"/><text class="doc" x="52" y="27">COT 8</text><text class="aut" x="470" y="27" text-anchor="end">Rosa</text></g>
      <g transform="translate(24,134)"><use href="#f-carlos"/><text class="doc" x="52" y="27">COT 7</text><text class="aut" x="470" y="27" text-anchor="end">Carlos</text></g>
      <g transform="translate(24,184)"><use href="#f-carlos"/><text class="doc" x="52" y="27">COT 6</text><text class="aut" x="470" y="27" text-anchor="end">Carlos</text></g>
      <g transform="translate(24,234)"><use href="#f-jose"/><text class="doc" x="52" y="27">COT 5</text><text class="aut" x="470" y="27" text-anchor="end">José</text></g>
      <g transform="translate(24,284)"><use href="#f-jose"/><text class="doc" x="52" y="27">COT 4</text><text class="aut" x="470" y="27" text-anchor="end">José</text></g>
      <g transform="translate(24,334)"><use href="#f-ana"/><text class="doc" x="52" y="27">COT 3</text><text class="aut" x="470" y="27" text-anchor="end">Ana</text></g>
      <g transform="translate(24,384)"><use href="#f-ana"/><text class="doc" x="52" y="27">COT 2</text><text class="aut" x="470" y="27" text-anchor="end">Ana</text></g>
      <g transform="translate(24,434)"><use href="#f-ana"/><text class="doc" x="52" y="27">COT 1</text><text class="aut" x="470" y="27" text-anchor="end">Ana</text></g>
    </g>

    <!-- Columna de Ana: «Solo los propios» y, en la fase 3, «Equipo» -->
    <g transform="translate(660,168)">
      <rect class="card" width="540" height="504" rx="12" filter="url(#sombra)"/>
      <g class="solo-f12">
        <text class="h" x="28" y="42">Solo los propios</text>
        <text class="hc" x="28" y="66">Ana ve únicamente lo que ella creó</text>
      </g>
      <g class="ajeno" transform="translate(24,84)"><use href="#f-rosa"/><text class="doc" x="52" y="27">COT 8</text><text class="aut" x="430" y="27" text-anchor="end">Rosa</text></g>
      <g class="ajeno" transform="translate(24,134)"><use href="#f-carlos"/><text class="doc" x="52" y="27">COT 7</text><text class="aut" x="430" y="27" text-anchor="end">Carlos</text></g>
      <g class="ajeno" transform="translate(24,184)"><use href="#f-carlos"/><text class="doc" x="52" y="27">COT 6</text><text class="aut" x="430" y="27" text-anchor="end">Carlos</text></g>
      <g class="ajeno equipo" transform="translate(24,234)"><use href="#f-jose"/><text class="doc" x="52" y="27">COT 5</text><text class="aut" x="430" y="27" text-anchor="end">José</text></g>
      <g class="ajeno equipo" transform="translate(24,284)"><use href="#f-jose"/><text class="doc" x="52" y="27">COT 4</text><text class="aut" x="430" y="27" text-anchor="end">José</text></g>
      <g transform="translate(24,334)"><use href="#f-ana"/><text class="doc" x="52" y="27">COT 3</text><text class="aut" x="470" y="27" text-anchor="end">Ana</text></g>
      <g transform="translate(24,384)"><use href="#f-ana"/><text class="doc" x="52" y="27">COT 2</text><text class="aut" x="470" y="27" text-anchor="end">Ana</text></g>
      <g transform="translate(24,434)"><use href="#f-ana"/><text class="doc" x="52" y="27">COT 1</text><text class="aut" x="470" y="27" text-anchor="end">Ana</text></g>
    </g>
  </g>

  <!-- 2 · «Solo los propios»: contadores y candados -->
  <g data-fase="2">
    <g transform="translate(496,186)">
      <rect width="100" height="32" rx="16" fill="#3DAA35"/>
      <text class="cuenta" x="50" y="21" text-anchor="middle">8 de 8</text>
    </g>
    <g class="solo-f2" transform="translate(1062,186)">
      <rect width="114" height="32" rx="16" fill="#04B19E"/>
      <use href="#embudo" transform="translate(12,6)"/>
      <text class="cuenta" x="66" y="21" text-anchor="middle">3 de 8</text>
    </g>
    <use href="#candado" transform="translate(1142,264)"/>
    <use href="#candado" transform="translate(1142,314)"/>
    <use href="#candado" transform="translate(1142,364)"/>
    <use class="solo-f2" href="#candado" transform="translate(1142,414)"/>
    <use class="solo-f2" href="#candado" transform="translate(1142,464)"/>
  </g>

  <!-- 3 · «Equipo»: vuelven las de José, compañero de Zona Este -->
  <g data-fase="3">
    <g transform="translate(660,168)">
      <text class="h" x="28" y="42">Equipo · Zona Este</text>
      <text class="hc" x="28" y="66">Ana ve lo suyo y lo de José, su compañero</text>
    </g>
    <g transform="translate(1062,186)">
      <rect width="114" height="32" rx="16" fill="#1273B8"/>
      <use href="#embudo" transform="translate(12,6)"/>
      <text class="cuenta" x="66" y="21" text-anchor="middle">5 de 8</text>
    </g>
  </g>
</svg>
